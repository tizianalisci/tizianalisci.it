name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Without a custom domain the site lives at username.github.io/<repo>/, so it needs that subfolder.
      # Once public/CNAME exists (tizianalisci.it), it is served from the root.
      - name: Imposta il percorso base
        run: |
          if [ -f public/CNAME ]; then echo "ASTRO_BASE=/" >> "$GITHUB_ENV"; else echo "ASTRO_BASE=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"; fi
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
